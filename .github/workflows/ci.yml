name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friday_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d friday_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friday_ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Generate Prisma client
        working-directory: app
        run: npx prisma generate

      - name: Validate database migrations
        working-directory: app
        run: npx prisma migrate deploy

      - name: Verify migrated schema parity
        working-directory: app
        run: >-
          npx prisma migrate diff --exit-code
          --from-config-datasource
          --to-schema=prisma/schema.prisma

      - name: TypeScript check
        working-directory: app
        run: npx tsc --noEmit

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Grounding evaluation
        run: pnpm eval:grounding

      - name: AI contract tests
        working-directory: app
        run: npm run test:ai

      - name: Guest isolation tests
        working-directory: app
        run: npm run test:guests

      - name: Attachment contract tests
        working-directory: app
        run: npm run test:attachments

      - name: Release hygiene tests
        working-directory: app
        run: npm run test:release-hygiene

      - name: WorkItem compatibility tests
        working-directory: app
        run: npm run test:work-items

      - name: Dashboard domain tests
        working-directory: app
        run: npm run test:dashboard

      - name: Project editing contract tests
        working-directory: app
        run: npm run test:projects

      - name: Work grouping tests
        working-directory: app
        run: npm run test:work-grouping

      - name: Production dependency audit
        working-directory: app
        run: npm run audit:production

      - name: Build
        working-directory: app
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-placeholder' }}
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: ''

  python-ai:
    name: Python AI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check app tests

      - name: Mypy
        run: uv run mypy .

      - name: Tests
        run: uv run pytest -q
