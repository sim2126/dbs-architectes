name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friday_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d friday_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friday_ci

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Generate Prisma client
        working-directory: app
        run: npx prisma generate

      - name: Validate database migrations
        working-directory: app
        run: npx prisma migrate deploy

      - name: Verify migrated schema parity
        working-directory: app
        run: >-
          npx prisma migrate diff --exit-code
          --from-config-datasource
          --to-schema=prisma/schema.prisma

      - name: TypeScript check
        working-directory: app
        run: npx tsc --noEmit

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: Grounding evaluation
        run: pnpm eval:grounding

      - name: Coverage gate (Annexure F.1 — ≥70% lines on critical paths)
        working-directory: app
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: app/coverage/lcov.info
          if-no-files-found: ignore

      - name: AI contract tests
        working-directory: app
        run: npm run test:ai

      - name: Guest isolation tests
        working-directory: app
        run: npm run test:guests

      - name: Attachment contract tests
        working-directory: app
        run: npm run test:attachments

      - name: Release hygiene tests
        working-directory: app
        run: npm run test:release-hygiene

      - name: WorkItem compatibility tests
        working-directory: app
        run: npm run test:work-items

      - name: Dashboard domain tests
        working-directory: app
        run: npm run test:dashboard

      - name: Project editing contract tests
        working-directory: app
        run: npm run test:projects

      - name: Work grouping tests
        working-directory: app
        run: npm run test:work-grouping

      - name: Production dependency audit
        working-directory: app
        run: npm run audit:production

      - name: Build
        working-directory: app
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-secret-placeholder' }}
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: ''

  python-ai:
    name: Python AI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check app tests

      - name: Mypy
        run: uv run mypy .

      - name: Tests
        run: uv run pytest -q

  e2e:
    name: E2E + accessibility (Annexure F.1)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: friday_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d friday_e2e"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/friday_e2e
      # Plain Postgres in CI: the Neon WebSocket driver cannot reach it.
      DATABASE_ADAPTER: pg
      NEXTAUTH_URL: http://localhost:3100
      AUTH_URL: http://localhost:3100
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_SECRET: e2e-only-not-a-real-secret
      AUTH_SECRET: e2e-only-not-a-real-secret
      BASE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Prisma generate + migrate
        working-directory: app
        run: npx prisma generate && npx prisma migrate deploy
      - name: Seed demo data
        working-directory: app
        env:
          FRIDAY_DEMO_SEED_ALLOW: I_UNDERSTAND_THIS_REPLACES_DEMO_DATA
          FRIDAY_DEMO_SEED_TARGET: localhost:5432/friday_e2e?schema=public
        run: npx tsx prisma/seed-demo.ts && npx tsx prisma/seed-demo-account.ts && npx tsx prisma/seed-ai-files.ts
      - name: Build
        working-directory: app
        run: npm run build
      - name: Start server
        working-directory: app
        run: |
          nohup npx next start -p 3100 > server.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/api/ai-status || true)
            case "$code" in 200|401|403) echo "up after ${i}s"; exit 0;; esac; sleep 1
          done; echo "server did not start"; tail -50 server.log; exit 1
      - name: Install Playwright browsers
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run journeys
        working-directory: app
        run: npm run test:e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          if-no-files-found: ignore
