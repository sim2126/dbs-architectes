[project]
name = "dbs-architectes-api"
version = "0.1.0"
description = "DBS Architectes — FastAPI backend with LangGraph agents"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.12",

    # Data validation
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",

    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",

    # Redis
    "redis[hiredis]==5.2.1",

    # Task Queue
    "celery[redis]==5.4.0",
    "celery-redbeat>=2.2.0",
    "flower==2.0.1",

    # LLM & Agents
    "openai>=1.58.1,<2.0.0",
    "langchain==0.3.13",
    "langchain-openai==0.2.14",
    "langchain-core==0.3.28",
    "langchain-community==0.3.13",
    "langgraph==0.2.60",
    "langgraph-checkpoint==2.0.8",

    # Vector DB
    "qdrant-client==1.12.1",

    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",

    # HTTP Client
    "httpx==0.28.1",
    "tenacity==9.0.0",

    # Logging & Observability
    "structlog==24.4.0",

    # AWS SDK
    "boto3==1.35.86",

    # Utilities
    "python-dotenv==1.0.1",
    "orjson==3.10.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.1",           # for TestClient
    "asgi-lifespan>=2.1.0",    # FastAPI lifespan events in test harness
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.1",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]   # B008 = function calls in default args (FastAPI Depends)

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
