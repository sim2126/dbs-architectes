<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Aria — DBS Architectes AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="56%"  stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="stroke" x1="10" y1="11" x2="54" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#bfdbfe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" fill="none" stroke="white" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Apex glow -->
  <circle cx="32" cy="11" r="10" fill="url(#glow)"/>

  <!-- Left leg: (32,11) → (10,52) -->
  <line x1="32" y1="11" x2="10" y2="52" stroke="url(#stroke)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Right leg: (32,11) → (54,52) -->
  <line x1="32" y1="11" x2="54" y2="52" stroke="url(#stroke)" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Crossbar: (19,35) → (45,35) -->
  <line x1="19" y1="35" x2="45" y2="35" stroke="url(#stroke)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Apex node (primary intelligence point) -->
  <circle cx="32" cy="11" r="4.5" fill="#1e3a8a"/>
  <circle cx="32" cy="11" r="3"   fill="#60a5fa"/>
  <circle cx="32" cy="11" r="1.6" fill="white"/>

  <!-- Base-left node -->
  <circle cx="10" cy="52" r="2.5" fill="#22d3ee" fill-opacity="0.65"/>
  <circle cx="10" cy="52" r="1.2" fill="#22d3ee" fill-opacity="0.9"/>

  <!-- Base-right node -->
  <circle cx="54" cy="52" r="2.5" fill="#22d3ee" fill-opacity="0.65"/>
  <circle cx="54" cy="52" r="1.2" fill="#22d3ee" fill-opacity="0.9"/>

  <!-- Crossbar-left node -->
  <circle cx="19" cy="35" r="2"   fill="#93c5fd" fill-opacity="0.55"/>
  <circle cx="19" cy="35" r="1"   fill="#93c5fd" fill-opacity="0.9"/>

  <!-- Crossbar-right node -->
  <circle cx="45" cy="35" r="2"   fill="#93c5fd" fill-opacity="0.55"/>
  <circle cx="45" cy="35" r="1"   fill="#93c5fd" fill-opacity="0.9"/>
</svg>
